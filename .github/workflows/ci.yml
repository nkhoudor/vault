name: CI

# Static checks and tests. Runs on every pull request, and is reused by the
# TestFlight workflow so nothing is uploaded from a commit that fails them.
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: make deps

      - name: Check formatting
        run: make format-check

      # lib/generated/ is not committed, so freezed, json and route code is built here.
      - name: Generate code
        run: make gen

      - name: Analyze
        run: make analyze

      # Golden tests compare against images rendered on a developer machine and
      # differ by a few pixels elsewhere, so they are a local check only.
      - name: Test
        run: make test
