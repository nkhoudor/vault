# Regenerate with: dart run flutter_native_splash:create --path=./flutter_native_splash.yaml
flutter_native_splash:
  color: "#eff1f5"
  color_dark: "#1e1e2e"
  image: assets/splash/splash.png
  image_dark: assets/splash/splash_dark.png
  branding: assets/splash/branding.png
  branding_dark: assets/splash/branding_dark.png
  branding_bottom_padding: 24
  fullscreen: true

  # Android 12 and later clip the image to a circle, so it has its own, smaller mark.
  android_12:
    color: "#eff1f5"
    color_dark: "#1e1e2e"
    image: assets/splash/splash_android12.png
    image_dark: assets/splash/splash_android12_dark.png
    branding: assets/splash/branding.png
    branding_dark: assets/splash/branding_dark.png
